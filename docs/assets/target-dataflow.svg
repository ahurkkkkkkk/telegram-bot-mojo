<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">Target data flow for a native Mojo Telegram bot client</title>
  <desc id="desc">A technical architecture diagram showing Telegram Bot API traffic through a native asynchronous HTTP client, Mojo JSON decoder and typed updates, filters, handler routing and a Mojo application callback, then request serialization and outbound HTTP. Optional PCRE2 and OpenSSL native dependencies are shown. Conversation handler work is marked as remaining.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fb923c"/></marker>
  </defs>
  <rect width="1280" height="570" rx="22" fill="#0b1220"/>
  <text x="48" y="48" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Native Mojo client: update-to-handler data path</text>
  <text x="48" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Target architecture · no embedded Python runtime or Python callback bridge</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="48" y="143" width="140" height="88" rx="13" fill="#162439" stroke="#64748b" stroke-width="2"/>
    <text x="118" y="178" fill="#e2e8f0" font-size="16" font-weight="700">Telegram</text><text x="118" y="201" fill="#94a3b8" font-size="13">Bot API</text>
    <rect x="232" y="143" width="172" height="88" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
    <text x="318" y="174" fill="#e0f2fe" font-size="15" font-weight="700">Async HTTP</text><text x="318" y="197" fill="#7dd3fc" font-size="13">transport + retries</text><text x="318" y="216" fill="#64748b" font-size="11">target: parity</text>
    <rect x="448" y="143" width="172" height="88" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
    <text x="534" y="174" fill="#e0f2fe" font-size="15" font-weight="700">JSON decode</text><text x="534" y="197" fill="#7dd3fc" font-size="13">typed Mojo values</text><text x="534" y="216" fill="#64748b" font-size="11">target: full model set</text>
    <rect x="664" y="143" width="152" height="88" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
    <text x="740" y="174" fill="#e0f2fe" font-size="15" font-weight="700">Update model</text><text x="740" y="197" fill="#7dd3fc" font-size="13">typed update objects</text><text x="740" y="216" fill="#64748b" font-size="11">partial port</text>
    <rect x="860" y="143" width="152" height="88" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
    <text x="936" y="174" fill="#e0f2fe" font-size="15" font-weight="700">Filters</text><text x="936" y="197" fill="#7dd3fc" font-size="13">predicates / routing</text><text x="936" y="216" fill="#64748b" font-size="11">partial port</text>
    <rect x="1056" y="143" width="176" height="88" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1144" y="174" fill="#e0f2fe" font-size="15" font-weight="700">Handler groups</text><text x="1144" y="197" fill="#7dd3fc" font-size="13">priority / stop rules</text><text x="1144" y="216" fill="#64748b" font-size="11">partial port</text>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M188 187 H226"/><path d="M404 187 H442"/><path d="M620 187 H658"/><path d="M816 187 H854"/><path d="M1012 187 H1050"/>
  </g>
  <rect x="1056" y="333" width="176" height="76" rx="13" fill="#142b25" stroke="#34d399" stroke-width="2"/>
  <text x="1144" y="363" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Mojo callback</text><text x="1144" y="385" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">application logic</text>
  <path d="M1144 231 V326" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="333" width="190" height="76" rx="13" fill="#352617" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="875" y="363" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Conversation state</text><text x="875" y="385" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">remaining parity work</text>
  <path d="M1056 370 H977" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowOrange)"/>
  <rect x="48" y="333" width="200" height="76" rx="13" fill="#142439" stroke="#64748b" stroke-width="2"/>
  <text x="148" y="363" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Request serializer</text><text x="148" y="385" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">typed Bot API arguments</text>
  <rect x="300" y="333" width="172" height="76" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
  <text x="386" y="363" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Async HTTP</text><text x="386" y="385" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Bot API request</text>
  <path d="M1144 409 V464 H148 V415" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M248 371 H294" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M300 348 H265 V187 H226" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="517" y="333" width="190" height="76" rx="13" fill="#10283b" stroke="#38bdf8" stroke-width="2"/>
  <text x="612" y="363" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PCRE2 regex</text><text x="612" y="385" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">native dependency · partial</text>
  <path d="M860 214 V284 H707 V326" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="48" y="523" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">Solid arrows: main request/update path · dashed orange: unfinished feature family · dashed gray: native regex support/dependency edge</text>
</svg>
